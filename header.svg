<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Prithviraj Katkar — Computer Engineering, AI/ML and local-first systems" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111C33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#94A3B8" fill-opacity="0.18"/>
    </pattern>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <style>
      .name { font: 700 64px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #F8FAFC; letter-spacing: -1.5px; }
      .role { font: 500 22px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #38BDF8; }
      .meta { font: 400 17px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #94A3B8; }
      .pill { font: 600 14px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #4ADE80; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 50% { opacity: 0.25; } }
    </style>
  </defs>

  <rect width="1200" height="280" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="16" fill="url(#dots)"/>
  <rect width="1200" height="280" rx="16" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="279" rx="15.5" fill="none" stroke="#1E293B"/>

  <text x="72" y="118" class="name">Prithviraj Katkar</text>
  <rect x="74" y="140" width="96" height="3" rx="1.5" fill="url(#rule)"/>

  <text x="72" y="184" class="role">&gt; ai/ml · computer vision · local-first systems<tspan class="cursor">_</tspan></text>
  <text x="72" y="222" class="meta">Computer Engineering, PVGCOETM Pune (SPPU) — building complete systems from first principles.</text>

  <g transform="translate(900,52)">
    <rect width="228" height="36" rx="18" fill="#052E16" fill-opacity="0.7" stroke="#166534"/>
    <circle cx="22" cy="18" r="5" fill="#4ADE80" class="pulse"/>
    <text x="38" y="23" class="pill">open to internships</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
